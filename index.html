        const shuffleArray = (array) => {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        };

        const formatTime = (seconds) => {

            // --- Firebase Auth & Custom Session Restoration ---
            useEffect(() => {

                    if (firebaseUser) {
                        try {
                            // Registered user is signed in

                            if (profileDoc.exists) {

                                    uid: firebaseUser.uid,
                                    email: firebaseUser.email,
                                    ...profileData
                                }));
                            } else {
                                // Fallback/default profile if firestore document doesn't exist yet
                                const defaultProfile = {
                                    uid: firebaseUser.uid,
                                    username: firebaseUser.email ? firebaseUser.email.split('@')[0] : 'user',
                                    displayName: firebaseUser.displayName || firebaseUser.email ? firebaseUser.email.split('@')[0] : 'User',

                                await db.collection('users').doc(firebaseUser.uid).set(defaultProfile);

                                setUserName(defaultProfile.displayName);

                                localStorage.setItem('cos201_logged_user', JSON.stringify(defaultProfile));

                            setUserName(firebaseUser.displayName || firebaseUser.email);

                    } else {
                        // No firebase auth user is signed in. Let's check if there is a guest session

                        if (savedUserJSON) {
                            try {

                                if (!savedProfile.email && savedProfile.username) {
                                    // They are a guest!
                                    setUser(null);
                                    setUserProfile(savedProfile);
                                    setUserName(savedProfile.displayName || savedProfile.username);

                                    setUserProfile(null);
                                    localStorage.removeItem('cos201_username');

                    }
                    setAuthLoading(false);
                });
                return () => unsubscribe();

            // --- Fetch Cloud History ---
            const fetchCloudHistory = useCallback(async (uid) => {
                if (!uid) return;
                try {
                    const snapshot = await db.collection('attempts')
                        .where('userId', '==', uid)
                        .orderBy('createdAt', 'desc')
                        .limit(50)
                        .get();
                    
                    const cloudHistory = [];
                    snapshot.forEach(doc => {
                        const data = doc.data();
                        cloudHistory.push({
                            id: doc.id,
                            ...data,
                            date: data.createdAt ? new Date(data.createdAt).toLocaleDateString() : 'N/A'
                        });
                    });
                    
                    setHistory(prevLocal => {
                        const existingIds = new Set(cloudHistory.map(h => h.id));
                        const uniqueLocal = prevLocal.filter(h => !existingIds.has(h.id));
                        const merged = [...cloudHistory, ...uniqueLocal].sort((a, b) => b.createdAt ? new Date(b.createdAt) - new Date(a.createdAt) : 0);
                        localStorage.setItem('cos201_history', JSON.stringify(merged));
                        return merged;
                    });
                } catch (err) {
                    console.error("Error fetching cloud history:", err);
                }
            }, []);

                if (user) {
                    const currentOnLeaderboard = userProfile?.onLeaderboard ?? true;
                    const nextOnLeaderboard = !currentOnLeaderboard;
                    
                    try {
                        // 1. Update Profile in Firestore
                        await db.collection('users').doc(user.uid).update({
                            onLeaderboard: nextOnLeaderboard
                        });
                        
                        // 2. Update local state & localStorage
                        const updatedProfile = { ...userProfile, onLeaderboard: nextOnLeaderboard };
                        setUserProfile(updatedProfile);
                        localStorage.setItem('cos201_logged_user', JSON.stringify(updatedProfile));
                        
                        // 3. Update all past attempts by this user
                        const snapshot = await db.collection('attempts')
                            .where('userId', '==', user.uid)
                            .get();
                        
                        if (!snapshot.empty) {
                            const batch = db.batch();
                            snapshot.forEach(doc => {
                                batch.update(doc.ref, { onLeaderboard: nextOnLeaderboard });
                            });
                            await batch.commit();
                        }
                        
                        // 4. Re-fetch leaderboard to immediately reflect changes
                        fetchLeaderboard();
                    } catch (err) {
                        console.error("Error toggling authenticated user leaderboard:", err);
                    }
                } else {
                    // For guests
                    const nextOnLeaderboard = !guestOnLeaderboard;
                    setGuestOnLeaderboard(nextOnLeaderboard);
                    
                    try {
                        // Update previous guest attempts if matching userName
                        const snapshot = await db.collection('attempts')
                            .where('userId', '==', 'anonymous')

                            .get();
                        
                        if (!snapshot.empty) {

            // --- DB Auth Handlers ---
            const handleRegister = async (e) => {
                e.preventDefault();
                setAuthError('');
                setAuthLoading(true);
                
                const cleanEmail = authEmail.trim().toLowerCase();
                const cleanUsername = authUsername.trim().toLowerCase();
                const cleanDisplayName = cleanUsername.charAt(0).toUpperCase() + cleanUsername.slice(1);
                const cleanPassword = authPassword;
                
                if (!cleanEmail || !cleanUsername || !cleanPassword) {
                    setAuthError('Please fill in all fields.');
                    setAuthLoading(false);
                    return;
                }

                if (!cleanEmail.includes('@')) {
                    setAuthError('Please enter a valid email address.');
                    setAuthLoading(false);
                    return;
                }
                
                if (cleanPassword.length < 6) {
                    setAuthError('Password must be at least 6 characters.');
                    setAuthLoading(false);
                    return;
                }
                
                try {
                    // Check if username is already taken in our custom collection
                    const snapshot = await db.collection('users').where('username', '==', cleanUsername).get();
                    if (!snapshot.empty) {
                        setAuthError('Username is already taken.');
                        setAuthLoading(false);
                        return;
                    }
                    
                    // Create Firebase Auth user with real Email
                    const userCredential = await firebase.auth().createUserWithEmailAndPassword(cleanEmail, cleanPassword);
                    const firebaseUser = userCredential.user;
                    
                    // Update auth profile
                    await firebaseUser.updateProfile({

                    // Save custom profile doc in Firestore

                    setUser(firebaseUser);

                    setAuthLoading(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setAuthError('');

                const cleanEmail = authEmail.trim().toLowerCase();
                const cleanPassword = authPassword;
                
                if (!cleanEmail || !cleanPassword) {
                    setAuthError('Please fill in all fields.');
                    setAuthLoading(false);
                    return;
                }

                if (!cleanEmail.includes('@')) {
                    setAuthError('Please enter a valid email address.');
                    setAuthLoading(false);
                    return;
                }
                
                try {
                    // Log in using Firebase Auth with real Email
                    const userCredential = await firebase.auth().signInWithEmailAndPassword(cleanEmail, cleanPassword);
                    const firebaseUser = userCredential.user;
                    
                    // Retrieve user profile document from Firestore
                    const docRef = db.collection('users').doc(firebaseUser.uid);
                    const userDoc = await docRef.get();
                    let profileData;
                    
                    if (userDoc.exists) {
                        profileData = userDoc.data();

            const submitExam = useCallback(async () => {
                const endTime = Date.now();
                const durationSeconds = Math.floor((endTime - startTime) / 1000);
                const timeTakenStr = formatTime(durationSeconds);

                const questionsResults = currentQuestions.map(q => {

                        question: q,
                        userAnswer,
                        isCorrect: userAnswer === q.correctAnswer
                    };
                });

                const correctCount = questionsResults.filter(r => r.isCorrect).length;
                const score = Math.round((correctCount / currentQuestions.length) * 100);

                const isLeaderboardEligible = user ? (userProfile?.onLeaderboard ?? authOnLeaderboard) : guestOnLeaderboard;

                const attempt = {
                    id: Date.now().toString(),
                    date: new Date().toLocaleDateString(),
                    score,
                    correct: correctCount,
                    incorrect: currentQuestions.length - correctCount,
                    total: currentQuestions.length,

                    difficulty: selectedCourse === 'gst212' ? selectedDifficulty : null,
                    onLeaderboard: isLeaderboardEligible,
                    userId: user ? user.uid : 'anonymous'

                // Prepare Firestore DB attempt object
                const dbAttempt = {

                    correct: correctCount,

                    difficulty: selectedCourse === 'gst212' ? selectedDifficulty : 'standard',
                    onLeaderboard: isLeaderboardEligible,
                    createdAt: new Date().toISOString()

                try {
                    const docRef = await db.collection('attempts').add(dbAttempt);
                    attempt.id = docRef.id;

                    console.error("Error saving score to database:", err);
                }

                const newHistory = [attempt, ...history];

                setScreen('results');
                setShowConfirmModal(false);
            }, [startTime, currentQuestions, userAnswers, history, selectedCourse, selectedDifficulty, user, userProfile, authOnLeaderboard, guestOnLeaderboard, userName]);

            useEffect(() => {
                let timer;
                if (screen === 'exam' && !isUnlimited) {
                    timer = setInterval(() => {
                        setTimeLeft(prev => {
                            if (prev <= 1) {
                                submitExam();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [screen, isUnlimited, submitExam]);

            const startExam = (unlimited) => {
                let pool = [];
                let targetCount = 60;

                if (selectedCourse === 'cos201') {
                    pool = COS201_QUESTIONS;
                    targetCount = 60;
                } else if (selectedCourse === 'gst212') {
                    const allGst = window.GST212_QUESTIONS || [];
                    if (selectedDifficulty === 'all') {
                        pool = allGst;
                        targetCount = 60;
                    } else {
                        pool = allGst.filter(q => q.difficulty === selectedDifficulty);
                        targetCount = Math.min(pool.length, 40);
                    }
                }

                const sections = Array.from(new Set(pool.map(q => q.section)));
                const grouped = {};
                sections.forEach(s => {
                    grouped[s] = shuffleArray(pool.filter(q => q.section === s));
                });

                const selected = [];
                let sectionIndex = 0;
                let attempts = 0;
                while (selected.length < targetCount && attempts < 1000) {
                    const section = sections[sectionIndex % sections.length];
                    const question = grouped[section].pop();
                    if (question) selected.push(question);
                    sectionIndex++;
                    attempts++;
                    if (sections.every(s => grouped[s].length === 0)) break;
                }

                const finalPool = shuffleArray(selected).map(q => ({
                    ...q,
                    options: shuffleArray(q.options)
                }));

                setCurrentQuestions(finalPool);

                                                        {leaderboard.map((item, idx) => {
                                                            const isUser = user && item.userId === user.uid;
                                                            return (
                                                                <div 
                                                                    key={item.id} 
                                                                    className={`flex items-center justify-between p-3.5 rounded-xl border transition-all ${
                                                                        isUser 
                                                                            ? 'bg-[#004493]/5 border-[#004493]/30 ring-1 ring-[#004493]/10' 
                                                                            : 'bg-slate-50 border-slate-100 hover:border-slate-200'
                                                                    }`}
                                                                >
                                                                    <div className="flex items-center gap-3">
                                                                        <div className={`w-6 h-6 rounded-full flex items-center justify-center font-bold text-[10px] ${
                                                                            idx === 0 
                                                                                ? 'bg-yellow-500 text-white shadow-sm shadow-yellow-500/20' 
                                                                                : idx === 1 
                                                                                    ? 'bg-slate-400 text-white' 
                                                                                    : idx === 2 
                                                                                        ? 'bg-amber-600 text-white' 
                                                                                        : 'bg-slate-200 text-slate-600'
                                                                        }`}>
                                                                            {idx + 1}
                                                                        </div>
                                                                        <div>
                                                                            <div className="font-bold text-slate-800 text-sm flex items-center gap-1.5 leading-none mb-1">
                                                                                {item.userName}
                                                                                {isUser && <span className="text-[9px] font-bold uppercase bg-[#004493] text-white px-1 py-0.5 rounded leading-none">You</span>}
                                                                            </div>
                                                                            <div className="text-[9px] text-slate-400 uppercase tracking-wider font-semibold flex items-center gap-1 leading-none">
                                                                                <span>{item.course?.toUpperCase()}</span>
                                                                                {item.difficulty && (
                                                                                    <>
                                                                                        <span>•</span>
                                                                                        <span>{item.difficulty}</span>
                                                                                    </>
                                                                                )}
                                                                            </div>
                                                                        </div>
                                                                    </div>
                                                                    <div className="text-right">
                                                                        <div className="font-extrabold text-slate-900 text-sm">{item.score}%</div>
                                                                        <div className="text-[9px] text-[#424654] leading-none mt-1">{item.timeTaken}</div>
                                                                    </div>
                                                                </div>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                );
            }

            if (screen === 'exam') {
                const currentQ = currentQuestions[currentIndex];
                const progress = ((currentIndex + 1) / currentQuestions.length) * 100;
                return (
                    <div className="min-h-screen flex flex-col bg-slate-50">
                        <header className="glass sticky top-0 z-30 px-6 py-4">
                            <div className="max-w-5xl mx-auto flex justify-between items-center">
                                <div className="flex items-center gap-4"><div className="w-10 h-10 bg-[#004493] text-white rounded-lg flex items-center justify-center font-bold">{currentIndex + 1}</div><div><div className="text-sm font-bold uppercase tracking-widest text-[#424654]">Question {currentIndex + 1} of {currentQuestions.length}</div><div className="text-xs text-[#004493] font-medium">{currentQ.section}</div></div></div>
                                <div className="flex items-center gap-6"><div className={`flex items-center gap-2 font-mono font-bold text-xl ${timeLeft < 300 ? 'text-red-500 animate-pulse' : 'text-[#004493]'}`}><TimerIcon size={20} />{isUnlimited ? '∞' : formatTime(timeLeft)}</div><button onClick={() => setShowConfirmModal(true)} className="px-6 py-2 bg-[#004493] text-white rounded-lg font-bold hover:opacity-90 transition-all">Submit</button></div>
                            </div>
                            <div className="absolute bottom-0 left-0 h-1 bg-slate-200 w-full"><motion.div className="h-full bg-[#004493]" initial={{ width: 0 }} animate={{ width: `${progress}%` }} /></div>
                        </header>
                        <main className="flex-grow flex items-center justify-center p-6">
                            <AnimatePresence mode="wait">
                                <motion.div key={currentIndex} initial={{ opacity: 0, x: 20 }} animate={{ opacity: 1, x: 0 }} exit={{ opacity: 0, x: -20 }} className="bento-card max-w-3xl w-full p-10">
                                    <h2 className="text-2xl font-bold mb-8 leading-tight">{currentQ.text}</h2>
                                    <div className="space-y-4">
                                        {currentQ.options.map((option, idx) => (
                                            <button key={idx} onClick={() => setUserAnswers(prev => ({ ...prev, [currentQ.id]: option }))} className={`w-full text-left p-5 rounded-xl border-2 transition-all flex items-center gap-4 group ${userAnswers[currentQ.id] === option ? 'border-[#004493] bg-[#004493]/5 ring-1 ring-[#004493]' : 'border-slate-100 hover:border-slate-300 hover:bg-slate-50'}`}>
                                                <div className={`w-8 h-8 rounded-lg flex items-center justify-center font-bold transition-all ${userAnswers[currentQ.id] === option ? 'bg-[#004493] text-white' : 'bg-slate-100 text-slate-500 group-hover:bg-slate-200'}`}>{String.fromCharCode(65 + idx)}</div>
                                                <span className="text-lg">{option}</span>
                                            </button>
                                        ))}
                                    </div>
                                </motion.div>
                            </AnimatePresence>
                        </main>
                        <footer className="p-6 bg-white border-t border-slate-100">
                            <div className="max-w-5xl mx-auto flex justify-between">
                                <button onClick={() => setCurrentIndex(prev => Math.max(0, prev - 1))} disabled={currentIndex === 0} className="flex items-center gap-2 px-6 py-3 rounded-xl font-bold text-[#424654] hover:bg-slate-50 disabled:opacity-30 transition-all"><ChevronLeft size={20} /> Previous</button>
                                <button onClick={() => { if (currentIndex < currentQuestions.length - 1) setCurrentIndex(prev => prev + 1); else setShowConfirmModal(true); }} className="btn-primary">{currentIndex === currentQuestions.length - 1 ? 'Finish Exam' : 'Next Question'} <ChevronRight size={20} /></button>
                            </div>
                        </footer>
                        <AnimatePresence>
                            {showConfirmModal && (
                                <div className="fixed inset-0 z-50 flex items-center justify-center p-6 bg-slate-900/50 backdrop-blur-sm">
                                    <motion.div initial={{ scale: 0.9, opacity: 0 }} animate={{ scale: 1, opacity: 1 }} exit={{ scale: 0.9, opacity: 0 }} className="bento-card max-w-md w-full text-center">
                                        <div className="w-16 h-16 bg-yellow-50 text-yellow-600 rounded-full flex items-center justify-center mx-auto mb-6"><AlertCircle size={32} /></div>
                                        <h3 className="text-2xl font-bold mb-2">Ready to Submit?</h3>
                                        <p className="text-[#424654] mb-8">You have answered {Object.keys(userAnswers).length} out of {currentQuestions.length} questions.</p>
                                        <div className="flex gap-4"><button onClick={() => setShowConfirmModal(false)} className="flex-1 px-6 py-3 rounded-xl border border-slate-200 font-bold hover:bg-slate-50 transition-all">Review</button><button onClick={submitExam} className="flex-1 btn-primary">Submit Now</button></div>
                                    </motion.div>
                                </div>
                            )}
                        </AnimatePresence>
                    </div>
                );
            }

            if (screen === 'results' && lastAttempt) {
                return (
                    <div className="max-w-7xl mx-auto px-6 py-12">
                        <div className="no-print">
                            <div className="flex justify-between items-center mb-12"><h1 className="text-4xl font-bold">Simulation Analysis</h1><div className="flex gap-4"><button onClick={() => window.print()} className="flex items-center gap-2 px-6 py-3 rounded-xl border border-slate-200 font-bold hover:bg-slate-50 transition-all"><Printer size={18} /> Print Corrections</button><button onClick={() => setScreen('dashboard')} className="btn-primary"><LayoutDashboard size={18} /> Dashboard</button></div></div>
                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 mb-12">
                                <div className="lg:col-span-8 bento-card bg-slate-50 border-none flex flex-col md:flex-row items-center gap-12 p-12">
                                    <div className="relative"><svg className="w-48 h-48 transform -rotate-90"><circle cx="96" cy="96" r="88" fill="none" stroke="currentColor" strokeWidth="12" className="text-slate-200" /><motion.circle cx="96" cy="96" r="88" fill="none" stroke="currentColor" strokeWidth="12" strokeDasharray={552.92} initial={{ strokeDashoffset: 552.92 }} animate={{ strokeDashoffset: 552.92 - (552.92 * lastAttempt.score) / 100 }} transition={{ duration: 1.5, ease: "easeOut" }} className="text-[#004493]" /></svg><div className="absolute inset-0 flex flex-col items-center justify-center"><span className="text-5xl font-bold">{lastAttempt.score}%</span><span className="text-xs font-bold uppercase tracking-widest opacity-40">Final Score</span></div></div>
                                    <div className="flex-grow text-center md:text-left"><div className="mb-4"><Badge score={lastAttempt.score} /></div><h2 className="text-3xl font-bold mb-4">Performance Insights</h2><p className="text-[#424654] mb-6">{lastAttempt.score >= 70 ? "Excellent mastery!" : lastAttempt.score >= 40 ? "Solid understanding." : "Focus on the basics."}</p><div className="grid grid-cols-3 gap-6"><div><div className="text-2xl font-bold text-green-600">{lastAttempt.correct}</div><div className="text-xs font-bold opacity-40 uppercase tracking-widest">Correct</div></div><div><div className="text-2xl font-bold text-red-500">{lastAttempt.incorrect}</div><div className="text-xs font-bold opacity-40 uppercase tracking-widest">Incorrect</div></div><div><div className="text-2xl font-bold text-[#004493]">{lastAttempt.timeTaken}</div><div className="text-xs font-bold opacity-40 uppercase tracking-widest">Time</div></div></div></div>
                                </div>
                                <div className="lg:col-span-4 bento-card bg-[#004493] text-white flex flex-col justify-center p-10"><h3 className="text-xl font-bold mb-4">Mastery Breakdown</h3><div className="space-y-4"><div className="flex justify-between items-center"><span className="opacity-70">Accuracy</span><span className="font-bold">{lastAttempt.score}%</span></div><div className="w-full h-2 bg-white/20 rounded-full overflow-hidden"><div className="h-full bg-white" style={{ width: `${lastAttempt.score}%` }} /></div><div className="flex justify-between items-center pt-4"><span className="opacity-70">Completion</span><span className="font-bold">100%</span></div><div className="w-full h-2 bg-white/20 rounded-full overflow-hidden"><div className="h-full bg-white" style={{ width: '100%' }} /></div></div></div>
                            </div>
                            <h3 className="text-2xl font-bold mb-8">Corrections View</h3>
                            <div className="space-y-6">
                                {lastAttempt.questions.map((result, idx) => (
                                    <div key={idx} className={`bento-card border-l-4 ${result.isCorrect ? 'border-green-500' : 'border-red-500'}`}>
                                        <div className="flex justify-between items-start mb-4"><div className="text-xs font-bold uppercase tracking-widest text-[#424654]">Question {idx + 1}</div>{result.isCorrect ? <span className="flex items-center gap-1 text-green-600 font-bold text-sm"><CheckCircle2 size={16} /> Correct</span> : <span className="flex items-center gap-1 text-red-500 font-bold text-sm"><XCircle size={16} /> Incorrect</span>}</div>
                                        <h4 className="text-lg font-bold mb-6">{result.question.text}</h4>
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            <div className={`p-4 rounded-xl border ${result.isCorrect ? 'bg-green-50 border-green-100' : 'bg-red-50 border-red-100'}`}><div className="text-xs font-bold uppercase tracking-widest opacity-40 mb-1">Your Choice</div><div className="font-medium">{result.userAnswer || 'No answer provided'}</div></div>
                                            {!result.isCorrect && <div className="p-4 rounded-xl bg-green-50 border border-green-100"><div className="text-xs font-bold uppercase tracking-widest opacity-40 mb-1">Correct Answer</div><div className="font-medium">{result.question.correctAnswer}</div></div>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="print-only p-12"><div className="text-center mb-12 border-b pb-8"><h1 className="text-4xl font-bold mb-2">{lastAttempt.course === 'gst212' ? 'GST212 Philosophy and Human Existence' : 'COS201 Computer Programming I'} Exam Corrections</h1><p className="text-xl">Student: {userName}</p><p className="text-slate-500">Date: {lastAttempt.date} | Score: {lastAttempt.score}%</p></div><div className="space-y-8">{lastAttempt.questions.map((result, idx) => (<div key={idx} className="pb-6 border-b"><div className="font-bold mb-2">Question {idx + 1}: {result.question.text}</div><div className="grid grid-cols-2 gap-4 text-sm"><div><span className="font-bold">Your Answer:</span> {result.userAnswer || 'None'}</div><div><span className="font-bold">Correct Answer:</span> {result.question.correctAnswer}</div></div><div className={`mt-2 font-bold text-xs uppercase ${result.isCorrect ? 'text-green-600' : 'text-red-600'}`}>{result.isCorrect ? '✓ Correct' : '✗ Incorrect'}</div></div>))}</div></div>
                    </div>
                );
            }
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
